[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nakdimon"
version = "2.0.0a0"
description = "Hebrew niqqud (diacritics) restoration — text layer + ONNX runtime wrapper"
requires-python = ">=3.12"
dependencies = [
    "onnxruntime>=1.20",
    "numpy>=2.1",
]

[project.scripts]
diacritize = "nakdimon.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nakdimon = ["data/hebrew.json", "data/Nakdimon.onnx", "data/Nakdimon.onnx.json"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
