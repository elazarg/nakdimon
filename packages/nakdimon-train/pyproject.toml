[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nakdimon-train"
version = "2.0.0a0"
description = "Training, export, and data pipeline for Nakdimon v2"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "numpy>=2.1",
    "requests>=2.32",
    "nakdimon>=2.0.0a0",
    "onnx>=1.17",
    "onnxscript>=0.2",
    "onnxruntime>=1.20",
]

[project.optional-dependencies]
tracking = ["wandb>=0.19"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.uv.sources]
nakdimon = { workspace = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 120
