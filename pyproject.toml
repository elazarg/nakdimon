# uv workspace root (virtual — the installable packages live in packages/).
# packages/nakdimon      : runtime (published to PyPI as "nakdimon")
# packages/nakdimon-train: research stack (not published)
# packages/nakdimon-js   : npm package (not managed by uv)

[tool.uv.workspace]
members = ["packages/nakdimon", "packages/nakdimon-train"]
