<!doctype html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>נקדימון - נקדן חינמי בדפדפן</title>
  <meta name="title" content="Automatic diacritization for Hebrew text"/>
  <meta name="description" content="נקדן אוטומטי וחינמי אונליין"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body dir="rtl">
  <div class="container">
    <div id="content">
      <h1>נקדימון</h1>
      <p class="subtitle">ניקוד אוטומטי לטקסט עברי, ישירות בדפדפן</p>

      <p id="status">טוען את המודל…</p>

      <div class="field">
        <label for="input_text">טקסט ללא ניקוד</label>
        <textarea id="input_text" required placeholder="יש להכניס טקסט לניקוד" autofocus></textarea>
      </div>

      <div class="buttons">
        <button id="dot_button" disabled>נקד</button>
        <button id="clear_button" class="secondary" type="button">ניקוי</button>
      </div>

      <div class="field">
        <label for="output_text">טקסט מנוקד</label>
        <textarea id="output_text" readonly placeholder="הטקסט המנוקד יופיע כאן"></textarea>
      </div>

      <div class="buttons">
        <button id="copy_button" class="secondary" type="button">העתקה ללוח</button>
      </div>
    </div>

    <footer>
      <p><a href="https://github.com/elazarg/nakdimon">github.com/elazarg/nakdimon</a></p>
      <p>נוצר על ידי אלעזר גרשוני <a href="mailto:elazarg@gmail.com">elazarg@gmail.com</a></p>
    </footer>
  </div>

  <!-- Pinned onnxruntime-web build; wasmPaths below must match this version. -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.min.js"></script>
  <script>
    ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/";
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
